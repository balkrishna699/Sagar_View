<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SAGAR — Interactive 3D ocean visualization platform integrating numerical model outputs and in-situ observations for INCOIS ocean forecasting." />
  <title>SAGAR: 3D Ocean Visualization</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #060d18;
      color: #c8dae8;
      overflow: hidden;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ── Header overlay ── */
    #app-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: linear-gradient(180deg, rgba(6,13,24,0.92) 0%, rgba(6,13,24,0) 100%);
      z-index: 50;
      pointer-events: none;
    }
    #app-header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #4db8ff;
      text-transform: uppercase;
    }
    #app-header span {
      font-size: 11px;
      color: #5a7a94;
      font-weight: 400;
    }

    /* ── Controls panel styling ── */
    .ctrl-panel {
      position: absolute;
      background: rgba(10, 22, 40, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(77, 184, 255, 0.15);
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      z-index: 100;
      color: #c8dae8;
      font-size: 13px;
    }
    .ctrl-panel label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6ea8d4;
    }
    .ctrl-panel input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #1a3a5c 0%, #4db8ff 100%);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .ctrl-panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4db8ff;
      box-shadow: 0 0 6px rgba(77,184,255,0.5);
      cursor: pointer;
    }
    .ctrl-panel button {
      padding: 6px 14px;
      border: 1px solid rgba(77,184,255,0.3);
      border-radius: 6px;
      background: rgba(77,184,255,0.12);
      color: #a0d4f7;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ctrl-panel button:hover {
      background: rgba(77,184,255,0.25);
      border-color: rgba(77,184,255,0.5);
      color: #fff;
    }
    .ctrl-panel button.active {
      background: rgba(77,184,255,0.3);
      border-color: #4db8ff;
      color: #fff;
    }

    /* Scrollbar hide */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="app-header">
      <h1>🌊 SAGAR</h1>
      <span>Interactive 3D Ocean Visualization Platform</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
